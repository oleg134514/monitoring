# =============================================
# Конфигурация API Gateway
# =============================================
#
# Этот файл должен лежать рядом с api_gateway.py
# в одной директории.
#
# Приоритет настроек:
#   1. Переменные окружения (env)
#   2. Этот файл (conf)
#   3. Значения по умолчанию (в коде)
# =============================================

# =============================================
# --- Подключение к базе данных PostgreSQL ---
# =============================================

# Хост, на котором работает PostgreSQL.
# localhost — если БД на этом же сервере.
# IP-адрес или имя хоста — если БД на отдельном сервере.
# Примеры: localhost, 192.168.1.100, db.local
DB_HOST=localhost

# Порт PostgreSQL. Обычно 5432.
# Если при установке меняли порт — укажите его.
# Примеры: 5432, 5433
DB_PORT=5432

# Имя базы данных для проекта мониторинга.
# Создаётся при развёртывании (deploy_db.sh).
# Примеры: monitoring, mon_db
DB_NAME=monitoring

# Пользователь базы данных.
# Должен иметь права на чтение и запись в БД.
# Примеры: monitoring, mon_user
DB_USER=monitoring

# Пароль пользователя базы данных.
# Рекомендуется сменить на надёжный пароль.
# Примеры: monitoring, MyS3cureP@ss
DB_PASS=monitoring

# =============================================
# --- Настройки HTTP-сервера (API Gateway) ---
# =============================================

# На каком сетевом интерфейсе слушать подключения.
# 0.0.0.0 — принимать подключения со всех интерфейсов (внешние и локальные).
# 127.0.0.1 — только локальные подключения (для отладки).
# Конкретный IP — слушать только на этом интерфейсе.
# Примеры: 0.0.0.0, 127.0.0.1, 192.168.1.50
LISTEN_HOST=0.0.0.0

# Порт, на котором будет работать API Gateway.
# Этот же порт указывается в конфигах агентов (MONITOR_SERVER).
# Примеры: 1234, 8080, 3000
LISTEN_PORT=1234

# =============================================
# --- Логирование ---
# =============================================

# Уровень детализации логов.
# DEBUG — максимальная детализация (для отладки).
# INFO — обычная информация (рекомендуется).
# WARNING — только предупреждения и ошибки.
# ERROR — только ошибки.
# Примеры: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL=ERROR

# =============================================
# --- Маппинг IP → server_id ---
# =============================================
#
# Позволяет назначить каждому серверу свой числовой
# идентификатор (1, 2, 3, 4...) по его IP-адресу.
#
# server_id используется:
#   - для хранения метрик в БД
#   - для отображения данных на дисплее (server_1, server_2...)
#
# Формат: IP:ID,IP:ID,... (через запятую, без пробелов)
#
# Примеры:
#   SERVER_ID_MAP=172.16.76.40:1,172.16.76.60:2,172.16.100.1:3,172.16.76.235:4
#   SERVER_ID_MAP=192.168.1.10:1,192.168.1.11:2
#   SERVER_ID_MAP=10.0.0.1:1
#
SERVER_ID_MAP=172.16.76.40:1,172.16.76.235:2,172.16.76.60:3,172.16.100.1:4

# =============================================
# --- Маппинг hostname → server_id ---
# =============================================
#
# Используется, если IP-адрес сервера не найден
# в SERVER_ID_MAP. Сравнивается имя хоста (hostname).
#
# Формат: hostname:ID,hostname:ID,...
#
# Примеры:
#   HOSTNAME_ID_MAP=proxmox:1,pbs:2,vyos:3,nas:4
#   HOSTNAME_ID_MAP=pve1:1,storage:2,router:3
#   HOSTNAME_ID_MAP=server1:1,server2:2
#
HOSTNAME_ID_MAP=PVE:1,NAS:2,PBS:3,VPS:4

# =============================================
# --- Fallback server_id ---
# =============================================
#
# Если ни IP ни hostname сервера не совпали
# с указанными выше маппингами, ему присваивается
# этот ID. По умолчанию 99.
#
# Примеры: 99, 0, 999
#
DEFAULT_SERVER_ID=99
