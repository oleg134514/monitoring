# =============================================
# Конфигурация Weather Collector
# =============================================
#
# Этот файл должен лежать рядом с weather_collector.py
# в одной директории.
#
# Приоритет настроек:
#   1. Переменные окружения (env)
#   2. Этот файл (conf)
#   3. Значения по умолчанию (в коде)
# =============================================

# =============================================
# --- Местоположение (координаты города) ---
# =============================================
#
# Координаты нужны для запросов к Open-Meteo API.
# Узнать координаты своего города:
#   - Google Maps: кликните правой кнопкой мыши → скопируйте координаты
#   - Сайт: https://www.latlong.net/
#   - В поиске: "координаты <название города>"
#
# Название города (для отображения и логирования).
# Примеры: Moscow, Saint Petersburg, Kyiv, Test
WEATHER_CITY=Tumen

# Широта (latitude).
# Положительное число — северное полушарие.
# Отрицательное число — южное полушарие.
# Примеры: 55.75 (Москва), 59.93 (Санкт-Петербург), -33.86 (Сидней)
WEATHER_LAT=57.098

# Долгота (longitude).
# Положительное число — восточное полушарие.
# Отрицательное число — западное полушарие.
# Примеры: 37.62 (Москва), 30.32 (Санкт-Петербург), -118.24 (Лос-Анджелес)
WEATHER_LON=65.570

# Часовой пояс (смещение от UTC в часах).
# Москва: +3, Екатеринбург: +5, Владивосток: +10
# Примеры: 0, 3, 5, 10, -5
WEATHER_TZ=5

# =============================================
# --- Адрес API Gateway ---
# =============================================
#
# URL сервера мониторинга, куда отправляются
# собранные данные о погоде.
#
# Формат: http://<IP_или_хост>:<порт>
#
# Примеры:
#   http://localhost:1234
#   http://192.168.1.50:1234
#   http://monitor.local:1234
#
MONITOR_SERVER=http://localhost:1234

# =============================================
# --- Логирование ---
# =============================================
#
# Путь к файлу лога погодных данных.
# Сохраняются сырые ответы Open-Meteo API.
#
# Примеры:
#   weather_data.log
#   /var/log/weather_collector.log
#   /home/user/monitoring/weather_data.log
#
WEATHER_LOG=/dev/null
